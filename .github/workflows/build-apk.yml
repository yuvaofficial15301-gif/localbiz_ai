
name: Build LocalBiz AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LocalBiz AI APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # 4. Check Flutter
      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor -v

      # 5. Generate Android project if missing
      - name: Generate Android project
        shell: bash
        run: |
          if [ ! -d android ]; then
            mkdir -p /tmp/android_scaffold
            cd /tmp/android_scaffold

            flutter create \
              --platforms=android \
              --org com.localbiz \
              --project-name localbiz_ai app

            cp -R app/android "$GITHUB_WORKSPACE/android"
          fi

      # 6. Patch Android configuration
      - name: Patch Android configuration
        run: |
          python3 tool/patch_android.py

      # 7. Install Android SDK and NDK
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"

          echo "Android SDK: $SDK_ROOT"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$SDK_ROOT" -name sdkmanager -type f || true
            exit 1
          fi

          echo "Found SDK manager: $SDKMANAGER"

          echo "Accepting Android SDK licenses..."

          set +e
          yes | bash "$SDKMANAGER" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "Android SDK license acceptance failed."
            exit 1
          fi

          echo "Installing Android SDK 36 and NDK..."

          bash "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125"

          echo "Android SDK installation completed."

      # 8. Install SQLite
      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      # 9. Get Flutter dependencies
      - name: Get Flutter dependencies
        run: |
          flutter pub get

      # 10. Fix Android plugin Gradle configurations
      - name: Fix Android plugin Gradle configurations
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re

          cache = os.path.expanduser(
              "~/.pub-cache/hosted/pub.dev"
          )

          files = []

          for pattern in (
              "*/android/build.gradle",
              "*/android/build.gradle.kts",
          ):
              files.extend(
                  glob.glob(os.path.join(cache, pattern))
              )

          replacements = {
              "flutter.compileSdkVersion": "36",
              "flutter.minSdkVersion": "21",
              "flutter.targetSdkVersion": "36",
              "flutter.ndkVersion": '"26.1.10909125"',
          }

          patched = 0

          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              original = content

              for old, new in replacements.items():
                  content = content.replace(old, new)

              if content != original:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

                  patched += 1
                  print("Patched:", path)

          print("Plugin Gradle files checked:", len(files))
          print("Plugin Gradle files patched:", patched)

          remaining = []

          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              if re.search(
                  r"flutter\.(compileSdkVersion|minSdkVersion|targetSdkVersion|ndkVersion)",
                  content
              ):
                  remaining.append(path)

          if remaining:
              print("Unpatched Flutter SDK references:")
              for path in remaining:
                  print(path)
              raise SystemExit(1)

          print("Plugin SDK references verified.")
          PY

      # 11. Configure application SDK
      - name: Configure application SDK
        shell: bash
        run: |
          python3 - <<'PY'
          import re

          path = "android/app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          pattern = (
              r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?).*$"
          )

          content, count = re.subn(
              pattern,
              lambda match: match.group(1) + "36",
              content
          )

          if count == 0:
              raise SystemExit(
                  "Could not find compileSdk declaration in app/build.gradle"
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Application compile SDK set to 36.")
          PY

      # 12. Verify plugin Gradle files
      - name: Verify plugin Gradle files
        shell: bash
        run: |
          CACHE="$HOME/.pub-cache/hosted/pub.dev"

          for PLUGIN in speech_to_text sqlite3_sqlcipher; do
            echo ""
            echo "======================================"
            echo "Checking $PLUGIN"
            echo "======================================"

            PLUGIN_DIR=$(find "$CACHE" \
              -maxdepth 1 \
              -type d \
              -name "${PLUGIN}-*" \
              | sort -V | tail -n 1)

            if [ -z "$PLUGIN_DIR" ]; then
              echo "Plugin not found: $PLUGIN"
              find "$CACHE" -maxdepth 1 -type d \
                | grep -E "speech_to_text|sqlite3" || true
              exit 1
            fi

            GRADLE_FILE=$(find "$PLUGIN_DIR/android" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              ! -path "*/example/*" \
              2>/dev/null | head -n 1)

            if [ -z "$GRADLE_FILE" ]; then
              echo "No Android Gradle file found for $PLUGIN"
              find "$PLUGIN_DIR/android" -type f 2>/dev/null || true
              exit 1
            fi

            echo "Gradle file: $GRADLE_FILE"

            if grep -nE \
              'flutter\.(compileSdkVersion|minSdkVersion|targetSdkVersion|ndkVersion)' \
              "$GRADLE_FILE"; then
              echo "Unpatched Flutter SDK reference found!"
              exit 1
            fi

            echo "$PLUGIN verification passed."
          done

      # 13. Analyze Flutter project
      - name: Analyze Flutter project
        run: flutter analyze
        continue-on-error: true

      # 14. Build release APK
      - name: Build release APK
        run: |
          flutter build apk --release

      # 15. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated!"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 16. Upload APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: localbiz-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
