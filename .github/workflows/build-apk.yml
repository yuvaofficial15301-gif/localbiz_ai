
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" \
              -name sdkmanager -type f | head -n 1)
          fi

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found in Android SDK."
            find "${ANDROID_HOME}" -name sdkmanager -type f || true
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"
