
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            mkdir -p /tmp/android_scaffold
            cd /tmp/android_scaffold
            flutter create \
              --platforms=android \
              --org com.localbiz \
              --project-name localbiz_ai app
            cp -R app/android "$GITHUB_WORKSPACE/android"
          fi

      - name: Patch Android configuration
        run: |
          python3 tool/patch_android.py

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Debug speech_to_text Gradle file
        run: |
          FILE=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/speech_to_text-*/android/build.gradle" \
            | head -n 1)

          echo "PLUGIN FILE: $FILE"
          echo "--------------------------------"
          if [ -f "$FILE" ]; then
            nl -ba "$FILE" | head -60
            echo "--------------------------------"
            grep -nE "flutter|compileSdk|minSdk|targetSdk" "$FILE" || true
          else
            echo "speech_to_text Gradle file not found"
            exit 1
          fi

      - name: Show Android SDK configuration
        run: |
          echo "Android app Gradle configuration:"
          cat android/app/build.gradle
