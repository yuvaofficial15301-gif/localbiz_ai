
name: Build LocalBiz AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LocalBiz AI APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Java
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # 4. Check Flutter
      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor -v

      # 5. Generate Android project if missing
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            mkdir -p /tmp/android_scaffold
            cd /tmp/android_scaffold

            flutter create \
              --platforms=android \
              --org com.localbiz \
              --project-name localbiz_ai app

            cp -R app/android "$GITHUB_WORKSPACE/android"
          fi

      # 6. Apply project Android configuration
      - name: Patch Android configuration
        run: |
          python3 tool/patch_android.py

      # 7. Install Android SDK and NDK
      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" \
              -name sdkmanager -type f | head -n 1)
          fi

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125"

      # 8. Install SQLite
      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      # 9. Get Flutter dependencies
      - name: Get Flutter dependencies
        run: |
          flutter pub get

      # 10. Patch Android plugin Gradle files
      - name: Fix Android plugin Gradle configurations
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re

          cache = os.path.expanduser(
              "~/.pub-cache/hosted/pub.dev"
          )

          patterns = [
              os.path.join(cache, "*", "android", "build.gradle"),
              os.path.join(cache, "*", "android", "build.gradle.kts"),
          ]

          files = []
          for pattern in patterns:
              files.extend(glob.glob(pattern))

          patched_count = 0

          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              original = content

              replacements = {
                  "flutter.compileSdkVersion": "36",
                  "flutter.minSdkVersion": "21",
                  "flutter.targetSdkVersion": "36",
                  "flutter.ndkVersion": '"26.1.10909125"',
              }

              for old, new in replacements.items():
                  content = content.replace(old, new)

              if content != original:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

                  patched_count += 1
                  print("Patched:", path)

          print(
              "Total Android plugin Gradle files patched:",
              patched_count
          )

          # Confirm no Flutter SDK references remain
          remaining = []

          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              if re.search(r"flutter\.(compileSdkVersion|minSdkVersion|targetSdkVersion|ndkVersion)", content):
                  remaining.append(path)

          if remaining:
              print("Unpatched Flutter SDK references:")
              for path in remaining:
                  print(path)
              raise SystemExit(1)

          print("Android plugin SDK references verified.")
          PY

      # 11. Configure application SDK
      - name: Configure application SDK
        run: |
          python3 - <<'PY'
          import re

          path = "android/app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          content, count = re.subn(
              r"flutter\.compileSdkVersion",
              "36",
              content
          )

          if count == 0 and not re.search(
              r"compileSdk\s*(?:=)?\s*36",
              content
          ):
              raise SystemExit(
                  "Could not locate application compile SDK setting"
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Application compile SDK set to 36.")
          PY

      # 12. Verify important plugins
      - name: Verify plugin Gradle files
        run: |
          for PLUGIN in speech_to_text sqlite3_flutter_libs; do
            echo "Checking $PLUGIN"

            FILE=$(find "$HOME/.pub-cache/hosted/pub.dev" \
              -path "*/$PLUGIN-*/android/build.gradle" \
              | head -n 1)

            if [ -z "$FILE" ]; then
              echo "$PLUGIN Gradle file not found"
              exit 1
            fi

            echo "File: $FILE"
            grep -nE "compileSdk|minSdk|targetSdk|ndkVersion|flutter\." \
              "$FILE" || true

            if grep -qE \
              "flutter\.(compileSdkVersion|minSdkVersion|targetSdkVersion|ndkVersion)" \
              "$FILE"; then
              echo "Unpatched SDK reference in $PLUGIN"
              exit 1
            fi
          done

          echo "Plugin verification complete."

      # 13. Flutter analysis
      - name: Analyze Flutter project
        run: flutter analyze
        continue-on-error: true

      # 14. Build APK
      - name: Build release APK
        run: |
          flutter build apk --release

      # 15. Verify APK
      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated!"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 16. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: localbiz-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
