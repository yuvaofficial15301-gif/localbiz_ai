name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the APK to a GitHub Release

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android scaffold (kept out of git on purpose)
        run: |
          if [ ! -d android ]; then
            tmp="$(mktemp -d)"
            (cd "$tmp" && flutter create --platforms=android --org com.localbiz --project-name localbiz_ai app)
            cp -r "$tmp/app/android" ./android
          fi

      - name: Patch Android project (permissions, signing, biometrics)
        run: python3 tool/patch_android.py

      - name: Install SQLite for unit tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Run tests
        continue-on-error: true
        run: flutter test --reporter expanded 2>&1 | tee test.log

      - name: Build release APK
        run: flutter build apk --release 2>&1 | tee build.log

      - name: Verify APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          ls -l "$APK"
          sha256sum "$APK"
          cp "$APK" LocalBizAI-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalBizAI-apk
          path: LocalBizAI-release.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            analyze.log
            test.log
            build.log
          if-no-files-found: ignore

      - name: Publish GitHub Release (optional, easiest download on a phone)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LocalBiz AI build ${{ github.run_number }}
          files: LocalBizAI-release.apk
          prerelease: true
