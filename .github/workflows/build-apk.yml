
name: Build LocalBiz AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LocalBiz AI APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Install Java
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.3.11579264"

      # 4. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. Check Flutter
      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor -v

      # 6. Generate Android project if missing
      - name: Generate Android project
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "Generating Android project..."

            flutter create \
              --platforms=android \
              --org com.localbiz \
              --project-name localbiz_ai \
              .

          else
            echo "Android project already exists."
          fi

      # 7. Patch Android configuration
      - name: Patch Android configuration
        shell: bash
        run: |
          set -e

          if [ -f "tool/patch_android.py" ]; then
            python3 tool/patch_android.py
          else
            echo "No tool/patch_android.py found; skipping custom patch."
          fi

      # 8. Install SQLite dependencies
      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      # 9. Get Flutter dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 10. Fix Android plugin Gradle configurations
      - name: Fix Android plugin Gradle configurations
        shell: bash
        run: |
          set -e

          export PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          cache = Path(os.environ["PUB_CACHE"]) / "hosted" / "pub.dev"

          if not cache.exists():
              raise SystemExit("Pub cache directory not found.")

          replacements = {
              "flutter.compileSdkVersion": "36",
              "flutter.minSdkVersion": "21",
              "flutter.targetSdkVersion": "36",
              "flutter.ndkVersion": '"26.3.11579264"',
          }

          changed = []

          for file in cache.glob("*/android/*.gradle"):
              if "example" in file.parts:
                  continue

              original = file.read_text(
                  encoding="utf-8",
                  errors="replace"
              )
              updated = original

              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  file.write_text(updated, encoding="utf-8")
                  changed.append(str(file))

          for file in cache.glob("*/android/*.gradle.kts"):
              if "example" in file.parts:
                  continue

              original = file.read_text(
                  encoding="utf-8",
                  errors="replace"
              )
              updated = original

              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  file.write_text(updated, encoding="utf-8")
                  changed.append(str(file))

          print("Patched Android plugin Gradle files:")
          for file in changed:
              print(" -", file)

          print(f"Total patched files: {len(changed)}")
          PY

      # 11. Configure application SDK
      - name: Configure application SDK
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")

          if not gradle.exists():
              raise SystemExit("android/app/build.gradle not found.")

          content = gradle.read_text(encoding="utf-8")

          content, count = re.subn(
              r"compileSdkVersion\s+flutter\.compileSdkVersion",
              "compileSdkVersion 36",
              content
          )

          content, count2 = re.subn(
              r"compileSdk\s*=\s*flutter\.compileSdkVersion",
              "compileSdk = 36",
              content
          )

          gradle.write_text(content, encoding="utf-8")
          print("Application compile SDK configured.")
          PY

      # 12. Inspect plugin Gradle configuration
      - name: Inspect plugin Gradle configuration
        shell: bash
        run: |
          set -e

          CACHE="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev"

          echo "Checking speech_to_text..."
          find "$CACHE" \
            -path "*/speech_to_text-*/android/build.gradle" \
            ! -path "*/example/*" \
            -print

          echo "Checking SQLite packages..."
          find "$CACHE" -maxdepth 1 -type d \
            \( -name "sqlite3-*" \
            -o -name "sqlite3_flutter_libs-*" \
            -o -name "sqlite3_sqlcipher-*" \) \
            -print

      # 13. Analyze Flutter project
      - name: Analyze Flutter project
        continue-on-error: true
        run: flutter analyze

      # 14. Run tests
      - name: Run Flutter tests
        continue-on-error: true
        run: flutter test

      # 15. Build release APK
      - name: Build release APK
        run: flutter build apk --release

      # 16. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK generated successfully!"
          ls -lh "$APK"

      # 17. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalBiz-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
