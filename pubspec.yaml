name: localbiz_ai
description: LocalBiz AI - offline multilingual AI smart shop assistant for local businesses.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  encrypt: ^5.0.3
  local_auth: ^2.3.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  flutter_local_notifications: ^17.2.2
  connectivity_plus: ^6.0.5
  intl: ^0.19.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
